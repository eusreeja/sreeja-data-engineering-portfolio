<!DOCTYPE html> 
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>HTML Image Example</title>
    </head>
    
    <body>
    
        <h1>HTML Image Example</h1>
        <p>This is an example of how to use the &lt;img&gt; tag to display an image on a webpage.</p>
    
        <h2>Example Image</h2>
        <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Trulli" width="500">

        <img src="rocket.png" alt="A rocket ready to launch" width="350" height="350">
        <audio controls loop>
        <source src="music.mp3" type="audio/mpeg">
        </audio>
        <video width="500" height="350" controls poster="poster.png" loop>
        <source src="aqua.mp4" type="video/mp4">
        </video>
        <iframe src="https://scratch.mit.edu/projects/60917032/embed" width="500" height="400">
        </iframe>
    </body>
</html>
